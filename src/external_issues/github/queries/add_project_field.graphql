mutation AddProjectField($input: CreateProjectV2FieldInput!) {
    createProjectV2Field(input: $input) {
        projectV2Field {
            __typename
            ... on ProjectV2Field {
                id
            }
            ... on ProjectV2IterationField {
                id
            }
            ... on ProjectV2SingleSelectField {
                id
            }
        }
    }
}
