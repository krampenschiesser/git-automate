query ListProjectItems($id: ID!) {
    node(id: $id) {
        ... on ProjectV2 {
            items(first: 100) {
                nodes {
                    id
                    content {
                        __typename
                        ... on Issue {
                            id
                            number
                        }
                        ... on PullRequest {
                            id
                            number
                        }
                        ... on DraftIssue {
                            id
                        }
                    }
                }
            }
        }
    }
}
