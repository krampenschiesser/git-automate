[package]
name = "git-automate"
version = "0.1.0"
edition = "2024"

[dependencies]
dotenv = "0.15"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
clap = { version = "4", features = ["derive", "env"] }
thiserror = "1"
anyhow = "1"
base64 = "0.22"
regex = "1"
handlebars = "6"
tracing = "0.1"
tracing-subscriber = "0.3"
urlencoding = "2"

[dev-dependencies]
wiremock = "0.6"
tempfile = "3"
apollo-compiler = "1"

[lib]
path = "src/lib.rs"

[[bin]]
name = "git-automate"
path = "src/main.rs"
