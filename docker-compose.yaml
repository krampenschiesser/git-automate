services:
  init:
    env_file:
      - .env
    image: alpine/git:latest
    volumes:
      - data:/workspace
    entrypoint: []
    command: sh -c "cd /workspace; [ -d "git-automate-e2e" ] || git clone https://github.com/krampenschiesser/git-automate-e2e"
  opencode:
    image: ghcr.io/anomalyco/opencode:2.0.18
    depends_on:
      init:
        condition: service_completed_successfully
    env_file: .env
    ports:
      - "10082:4096"
    environment:
      - OPENCODE_LOG_LEVEL=DEBUG
      - OPENCODE_PRINT_LOGS=true
      - OPENCODE_SERVER_PASSWORD=${OPENCODE_PW}
      - OPENCODE_DISABLE_AUTOUPDATE=1
    # Image entrypoint is `opencode`; pass the v2 API/web server subcommand.
    command: ["serve", "--hostname", "0.0.0.0", "--port", "4096"]
    volumes:
      - "./docker/opencode-cfg.json:/root/.config/opencode/opencode.json"
      - data:/workspace
      - opencode-logs:/root/.local/share/opencode/logs
  opencode-logs:
    image: ghcr.io/anomalyco/opencode:2.0.18
    depends_on:
      opencode:
        condition: service_started
    volumes:
      - opencode-logs:/root/.local/share/opencode/logs
      - data:/workspace
    entrypoint: []
    command: tail -f /root/.local/share/opencode/logs/log/*
volumes:
  data:
  opencode-logs:
