opencode:
  concurrency:
    myprovider/slow: 2
    myprovider/fast: 4
  url: ${env:OPENCODE_URL}
  pw: ${env:OPENCODE_PW}
  cwd: ${env:PROJECT_PATH}
  project: git-automate
git:
  repository: https://github.com/krampenschiesser/git-automate
  projectId: 5
  issueProvider: github
  directory: /path/to/your/checkout
  token: ${env:GITHUB_TOKEN}
